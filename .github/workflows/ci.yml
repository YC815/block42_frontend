name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: block42
          POSTGRES_PASSWORD: block42
          POSTGRES_DB: block42_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://block42:block42@localhost:5432/block42_test
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: backend
        run: uv sync
      - name: Migrations apply cleanly
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Tests（含 30 關參考解與前後端關卡複本是否同步）
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
